name: Keep alive

# Why this exists
#   1. Supabase's free tier PAUSES a project after about a week without activity
#      (its hostname then stops resolving and the site shows an empty catalog).
#      This has already happened to this project. Rendering the home page runs a
#      Supabase query, so a daily visit counts as activity.
#   2. Render's free tier sleeps when idle; this also wakes it once a day.
#   3. It is a smoke test: if the catalog does NOT render, the job fails and GitHub
#      emails the repo owner — an early warning instead of a recruiter finding out.
#
# Note: scheduled workflows stop after 60 days without repository activity.
# If that ever happens, re-enable it from the Actions tab.

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch: # allow running it by hand

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://advishopping1.onrender.com
    steps:
      - name: Wake the site and load the catalog
        run: |
          # A sleeping free-tier instance can take ~1 minute to answer.
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 "$SITE_URL/" -o home.html

          # The page returns HTTP 200 even when the database is down (it shows an
          # error message instead of products), so check for real product links.
          if ! grep -q 'href="/product/' home.html; then
            echo "::error::Home page loaded but shows no products. Is the Supabase project paused? Restore it in the Supabase dashboard."
            exit 1
          fi
          echo "Catalog OK."

      - name: Exercise the search pipeline (database + models)
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 180 "$SITE_URL/search?q=headphones" -o /dev/null
